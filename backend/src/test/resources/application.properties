# In-Memory Test Configuration using H2 with PostgreSQL compatibility
spring.datasource.url=jdbc:h2:mem:stockmind_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Unit and integration tests exercise business rules without external authentication.
stockmind.security.enabled=false
